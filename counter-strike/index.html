<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#10151b"><title>CS Arena | MMD</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10151b;color:#fff;font-family:Tahoma,Arial,sans-serif;touch-action:none}canvas{display:block;width:100vw;height:100dvh;background:#202a2b}#hud{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:9px;align-items:center;background:#0b1019c9;border:1px solid #ffffff24;border-radius:14px;padding:8px 13px;font-size:13px;white-space:nowrap}.stat{background:#17212b;padding:6px 9px;border-radius:8px}.stat b{color:#a6ff69}.bottom{position:absolute;bottom:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:end}.panel{background:#0b1019d9;border:1px solid #ffffff25;border-radius:12px;padding:9px 12px;font-size:13px;line-height:1.8}.panel b{color:#a6ff69}.cross{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%)}.cross:before,.cross:after{content:"";position:absolute;background:#fff;box-shadow:0 0 3px #000}.cross:before{width:2px;height:18px;left:8px}.cross:after{height:2px;width:18px;top:8px}.overlay{position:fixed;inset:0;background:#080d13eF;display:flex;align-items:center;justify-content:center;padding:22px;text-align:center}.card{max-width:430px;width:100%;background:#151e27;border:1px solid #ffffff24;border-radius:20px;padding:25px;box-shadow:0 20px 80px #0008}.card h1{margin:0 0 8px;font-size:30px;color:#a6ff69}.card p{color:#c4ccd3;line-height:1.9;font-size:14px}.btn{border:0;border-radius:12px;background:#a6ff69;color:#14200e;font-weight:bold;font-size:16px;padding:13px 24px;margin:7px;cursor:pointer}.btn.secondary{background:#263542;color:#fff}.mobile{display:none;pointer-events:auto}.stick{width:116px;height:116px;border-radius:50%;background:#ffffff20;border:2px solid #ffffff50;position:relative;touch-action:none}.nub{width:43px;height:43px;border-radius:50%;background:#a6ff69bb;position:absolute;left:34px;top:34px}.actions{display:flex;gap:9px;align-items:end}.action{width:65px;height:65px;border-radius:50%;border:2px solid #ffffff55;background:#14212ddd;color:white;font-weight:bold;font-size:13px}.action.fire{width:82px;height:82px;background:#a6ff69;color:#13200c;border:0}.action.reload{width:58px;height:58px}.hint{font-size:11px;color:#b8c4ca;margin-top:10px}@media (pointer:coarse),(max-width:800px){.mobile{display:flex}.top{top:7px;font-size:11px;gap:5px;padding:6px}.bottom{bottom:12px}.panel{font-size:11px;padding:6px 8px}.cross{width:14px;height:14px}.cross:before{height:14px;left:6px}.cross:after{width:14px;top:6px}} 
</style></head>
<body><canvas id="game"></canvas><div id="hud"><div class="top"><span>CS ARENA</span><span class="stat">جان: <b id="hp">100</b></span><span class="stat">مهمات: <b id="ammo">12 / 60</b></span><span class="stat">حذف: <b id="kills">0</b></span><span class="stat">موج: <b id="wave">1</b></span></div><div class="cross"></div><div class="bottom"><div class="panel">حرکت: WASD<br>نشانه‌گیری: ماوس<br>شلیک: کلیک چپ | خشاب: R</div><div class="mobile"><div class="stick" id="stick"><div class="nub" id="nub"></div></div><div class="actions"><button class="action reload" id="reload">خشاب</button><button class="action fire" id="fire">شلیک</button></div></div><div class="panel" id="msg">آمادهٔ نبرد</div></div></div>
<div class="overlay" id="start"><div class="card"><h1>CS ARENA</h1><p>وارد میدان شو و دشمن‌ها را از بین ببر.<br>مراقب جانت باش؛ دشمن‌ها هم شلیک می‌کنند.</p><button class="btn" id="play">شروع بازی</button><p class="hint">برای بهترین تجربه، گوشی را افقی نگه دار.</p></div></div>
<div class="overlay" id="end" style="display:none"><div class="card"><h1 id="endtitle">پایان بازی</h1><p id="endtext"></p><button class="btn" id="again">شروع دوباره</button></div></div>
<script>
(()=>{const c=document.getElementById('game'),ctx=c.getContext('2d');let W,H,playing=false,last=0,keys={},player,enemies=[],bullets=[],walls=[],zbuf=[],kills=0,wave=1,ammo=12,reserve=60,reloading=false,flash=0,damage=0,move={x:0,y:0},lookTouch=null;
const map=[
'1111111111111111',
'1000000000000001',
'1000110001100001',
'1000000000000001',
'1011000110001101',
'1000000000000001',
'1000110001100001',
'1000000000000001',
'1001100000110001',
'1000000000000001',
'1111111111111111'];
function resize(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;ctx.setTransform(1,0,0,1,0,0)}addEventListener('resize',resize);resize();
function reset(){player={x:2.2,y:2.2,a:0,hp:100,shot:0};enemies=[];bullets=[];kills=0;wave=1;ammo=12;reserve=60;spawn(4);updateHud()}
function wall(x,y){return !map[Math.floor(y)]||map[Math.floor(y)][Math.floor(x)]!=='0'}
function spawn(n){for(let i=0;i<n;i++){let x,y,t=0;do{x=2+Math.random()*12;y=1.5+Math.random()*8;t++}while((wall(x,y)||Math.hypot(x-player.x,y-player.y)<4)&&t<300);enemies.push({x,y,hp:100,fire:Math.random()*1.5,hit:0})}}
function updateHud(){hp.textContent=Math.max(0,Math.ceil(player.hp));document.getElementById('ammo').textContent=ammo+' / '+reserve;killsEl.textContent=kills;waveEl.textContent=wave}
const hp=document.getElementById('hp'),killsEl=document.getElementById('kills'),waveEl=document.getElementById('wave');
function cast(a){let d=0,step=.035;while(d<20){d+=step;if(wall(player.x+Math.cos(a)*d,player.y+Math.sin(a)*d))return d}return 20}
function movePlayer(dt){let f=(keys.KeyW?1:0)-(keys.KeyS?1:0)-move.y,s=(keys.KeyD?1:0)-(keys.KeyA?1:0)+move.x;let l=Math.hypot(f,s);if(l){f/=l;s/=l;let dx=(Math.cos(player.a)*f-Math.sin(player.a)*s)*3*dt,dy=(Math.sin(player.a)*f+Math.cos(player.a)*s)*3*dt;if(!wall(player.x+dx,player.y))player.x+=dx;if(!wall(player.x,player.y+dy))player.y+=dy}}
function shoot(){if(!playing||reloading||player.shot>0)return;if(ammo<=0){document.getElementById('msg').textContent='خشاب خالی است';return}ammo--;player.shot=.22;flash=.08;let target=null,best=.12;for(const e of enemies){let dx=e.x-player.x,dy=e.y-player.y,dist=Math.hypot(dx,dy),ang=Math.atan2(dy,dx)-player.a;ang=Math.atan2(Math.sin(ang),Math.cos(ang));if(Math.abs(ang)<best&&dist<cast(player.a+ang)+.5){best=Math.abs(ang);target=e}}if(target){target.hp-=50;target.hit=.13;if(target.hp<=0){enemies=enemies.filter(e=>e!==target);kills++;document.getElementById('msg').textContent='دشمن حذف شد';if(!enemies.length){wave++;spawn(3+wave);document.getElementById('msg').textContent='موج '+wave+' شروع شد'}}}updateHud()}
function reload(){if(reloading||ammo===12||reserve<=0)return;reloading=true;document.getElementById('msg').textContent='در حال تعویض خشاب...';setTimeout(()=>{let n=Math.min(12-ammo,reserve);ammo+=n;reserve-=n;reloading=false;updateHud()},1100)}
function update(dt){if(!playing)return;player.shot=Math.max(0,player.shot-dt);flash=Math.max(0,flash-dt);damage=Math.max(0,damage-dt);movePlayer(dt);for(const e of enemies){let dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy);e.fire-=dt;e.hit=Math.max(0,e.hit-dt);if(d>2.2){let vx=dx/d*dt*.65,vy=dy/d*dt*.65;if(!wall(e.x+vx,e.y))e.x+=vx;if(!wall(e.x,e.y+vy))e.y+=vy}else if(e.fire<=0){e.fire=1.2+Math.random();if(Math.random()<.65){player.hp-=7;damage=.2;updateHud();if(player.hp<=0){player.hp=0;playing=false;document.getElementById('endtitle').textContent='شکست خوردی';document.getElementById('endtext').textContent='تعداد حذف‌شده‌ها: '+kills;document.getElementById('end').style.display='flex'}}}}}
function render(){let w=W,h=H;ctx.fillStyle='#81959a';ctx.fillRect(0,0,w,h/2);ctx.fillStyle='#353d38';ctx.fillRect(0,h/2,w,h/2);ctx.fillStyle='#48514b';ctx.fillRect(0,h*.5,w,h*.08);let fov=Math.PI/2.8;zbuf=[];for(let x=0;x<w;x+=Math.max(1,Math.floor(w/480))){let a=player.a+(x/w-.5)*fov,d=cast(a)*Math.cos(a-player.a);zbuf[x]=d;let sh=Math.max(30,155-d*9);let side=Math.abs(Math.sin(a))>.7;ctx.fillStyle='rgb('+Math.floor(sh*.75)+','+Math.floor(sh*.86)+','+Math.floor(sh*.8)+')';let colw=Math.max(1,Math.floor(w/480));ctx.fillRect(x,(h-h/d*.78)/2,colw,h/d*.78);ctx.fillStyle='rgba(0,0,0,.12)';ctx.fillRect(x,(h-h/d*.78)/2,colw,2)} 
let sorted=[...enemies].sort((a,b)=>Math.hypot(b.x-player.x,b.y-player.y)-Math.hypot(a.x-player.x,a.y-player.y));for(const e of sorted){let dx=e.x-player.x,dy=e.y-player.y,dist=Math.hypot(dx,dy),ang=Math.atan2(dy,dx)-player.a;ang=Math.atan2(Math.sin(ang),Math.cos(ang));if(Math.abs(ang)>fov*.7||dist<.2)continue;let sx=(.5+ang/fov)*w,sz=Math.min(h*1.4,h/dist*.75),sy=h/2-sz*.42;if(dist>cast(player.a+ang)+.4)continue;let bodyW=sz*.34;ctx.fillStyle=e.hit?'#fff':'#263b32';ctx.fillRect(sx-bodyW/2,sy+sz*.25,bodyW,sz*.58);ctx.fillStyle='#b58a68';ctx.beginPath();ctx.arc(sx,sy+sz*.16,sz*.13,0,Math.PI*2);ctx.fill();ctx.fillStyle='#171d22';ctx.fillRect(sx-bodyW*.4,sy+sz*.5,bodyW*.8,sz*.1);ctx.fillStyle='#f24c4c';ctx.fillRect(sx-bodyW/2,sy-8,bodyW,4);ctx.fillStyle='#65e66b';ctx.fillRect(sx-bodyW/2,sy-8,bodyW*Math.max(0,e.hp/100),4)}
// weapon
ctx.fillStyle='#151b20';ctx.beginPath();ctx.moveTo(w*.43,h);ctx.lineTo(w*.46,h*.78);ctx.lineTo(w*.55,h*.78);ctx.lineTo(w*.59,h);ctx.fill();ctx.fillStyle='#48545b';ctx.fillRect(w*.48,h*.76,w*.06,h*.18);ctx.fillStyle='#202a30';ctx.fillRect(w*.495,h*.65,w*.025,h*.14);if(flash){ctx.fillStyle='#ffe9a1';ctx.beginPath();ctx.arc(w*.51,h*.63,25*devicePixelRatio,0,7);ctx.fill()}if(damage){ctx.fillStyle='rgba(255,0,0,'+damage*1.8+')';ctx.fillRect(0,0,w,h)}}
function loop(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;update(dt);render();requestAnimationFrame(loop)}requestAnimationFrame(loop);
document.getElementById('play').onclick=()=>{reset();playing=true;document.getElementById('start').style.display='none';if(matchMedia('(pointer:fine)').matches)c.requestPointerLock?.()};document.getElementById('again').onclick=()=>{document.getElementById('end').style.display='none';reset();playing=true};
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyR')reload()});addEventListener('keyup',e=>keys[e.code]=false);c.addEventListener('click',()=>{if(playing&&document.pointerLockElement!==c&&matchMedia('(pointer:fine)').matches)c.requestPointerLock?.();shoot()});document.addEventListener('mousemove',e=>{if(playing&&document.pointerLockElement===c)player.a+=e.movementX*.0025});document.getElementById('fire').addEventListener('pointerdown',e=>{e.preventDefault();shoot()});document.getElementById('reload').onclick=reload;
let stick=document.getElementById('stick'),nub=document.getElementById('nub'),sid=null;stick.addEventListener('pointerdown',e=>{sid=e.pointerId;stick.setPointerCapture(sid);stickMove(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===sid)stickMove(e)});function stickMove(e){let r=stick.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),d=Math.hypot(x,y),m=35;if(d>m){x=x/d*m;y=y/d*m}nub.style.transform='translate('+x+'px,'+y+'px)';move.x=x/m;move.y=y/m}function stopStick(){sid=null;move={x:0,y:0};nub.style.transform=''}stick.addEventListener('pointerup',stopStick);stick.addEventListener('pointercancel',stopStick);
// right side drag to look
c.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'&&e.clientX>innerWidth*.48)lookTouch={id:e.pointerId,x:e.clientX}});c.addEventListener('pointermove',e=>{if(lookTouch&&e.pointerId===lookTouch.id){player.a+=(e.clientX-lookTouch.x)*.009;lookTouch.x=e.clientX}});c.addEventListener('pointerup',e=>{if(lookTouch&&e.pointerId===lookTouch.id)lookTouch=null});
})();
</script></body></html>
